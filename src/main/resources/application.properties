spring.application.name=upload-lab
server.port=8098

# 올린 파일을 저장할 폴더 (프로젝트 폴더 기준 상대 경로)
lab.upload.dir=uploads

# 업로드 기록을 어디에 남길지 고른다. 바꾸고 재시작하면 어댑터가 바뀐다
#   memory : 메모리 (InMemoryUploadRecordAdapter). 서버를 끄면 사라짐
#   file   : uploads/records.jsonl (FileUploadRecordAdapter). 껐다 켜도 남음
lab.record.type=memory
lab.chunked.chunk-size=5242880

# 1GB를 보내는 동안 연결이 끊기지 않게 넉넉히 둔다 (밀리초)
server.tomcat.connection-timeout=600000
