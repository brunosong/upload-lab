spring.application.name=upload-lab
server.port=8098

# 올린 파일을 저장할 폴더 (프로젝트 폴더 기준 상대 경로)
lab.upload.dir=uploads

# 업로드 기록을 어디에 남길지 고른다. 바꾸고 재시작하면 어댑터가 바뀐다
#   memory : 메모리 (InMemoryUploadRecordAdapter). 서버를 끄면 사라짐
#   file   : uploads/records.jsonl (FileUploadRecordAdapter). 껐다 켜도 남음
lab.record.type=memory
lab.chunked.chunk-size=5242880

# 1GB를 보내는 동안 연결이 끊기지 않게 넉넉히 둔다 (밀리초)
server.tomcat.connection-timeout=600000

# multipart 실험(/api/multipart)용. 기본값은 파일 1MB, 요청 10MB라 1GB는 바로 거절된다
# file-size-threshold 기본값은 0이라, 받는 즉시 톰캣 임시 폴더에 파일로 쓴다
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# CSV를 DB에 넣기(/api/streaming/imports)용 H2 파일 DB. uploads/h2/labdb.mv.db 에 저장되어 껐다 켜도 남는다
spring.datasource.url=jdbc:h2:file:./${lab.upload.dir}/h2/labdb
spring.datasource.username=sa
spring.datasource.password=
# 시작할 때 schema.sql 로 테이블을 만든다 (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
# 넣은 데이터 보기: http://localhost:8098/h2-console  (JDBC URL은 위와 같은 값, 사용자 sa)
spring.h2.console.enabled=true
