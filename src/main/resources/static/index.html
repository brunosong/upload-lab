<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대용량 업로드 연습장</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e3de; --accent:#2f5d8a; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--muted); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:20px; max-width:900px; }
  @media (max-width: 700px) { main { grid-template-columns:1fr; } }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; color:inherit; text-decoration:none; }
  a.card:hover { border-color:var(--accent); }
  a.card h2 { margin:0 0 6px; font-size:16px; color:var(--accent); }
  a.card p { margin:0; color:var(--muted); }
  .tag { display:inline-block; margin-top:10px; padding:1px 8px; border-radius:3px; background:#eef1f5; font-size:12px; }
  .tag.todo { background:#f3efe6; color:#8a6a2f; }
</style>
</head>
<body>
<header>
  <h1>대용량 업로드 연습장</h1>
  <p>1GB 파일을 메모리에 올리지 않고 서버에 보내는 방법을 기능별로 따로 봅니다.</p>
</header>
<main>
  <a class="card" href="/streaming/index.html">
    <h2>스트리밍 방식</h2>
    <p>파일을 요청 하나로 보냅니다. 양쪽 모두 메모리에 쌓지 않고 조금씩 흘려 보냅니다.</p>
    <span class="tag">streaming 패키지</span>
  </a>
  <a class="card" href="/chunked/index.html">
    <h2>파일 쪼개는 방식</h2>
    <p>파일을 10MB 조각으로 잘라 여러 번 보냅니다. 끊기면 빠진 조각만 다시 보냅니다.</p>
    <span class="tag todo">아직 안 만듦</span>
  </a>
</main>
</body>
</html>
